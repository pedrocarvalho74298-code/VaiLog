<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VaiLog - Logística Rápida e Segura</title>
<style>
  body, html {
    margin: 0; padding: 0;
    font-family: Arial, sans-serif;
    background: #004c00; /* verde escuro para enquadrar a imagem da marca */
    color: #fff;
  }
  header {
    background: #003300; 
    text-align: center;
    padding: 20px;
  }
  header img {
    max-width: 250px;
    height: auto;
  }
  header h1 {
    margin: 10px 0 0 0;
    font-weight: bold;
    font-size: 26px;
    color: #ffd700; /* amarelo dourado */
    text-shadow: 1px 1px 4px #000;
  }
  header p.slogan {
    font-size: 18px;
    margin-top: 5px;
    font-style: italic;
    color: #a6d608;
  }
  .cover {
    background: url('Designer%20(2).png') no-repeat center center/cover;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
  }
  .cover h2 {
    font-size: 32px;
    background-color: rgba(0, 51, 0, 0.7);
    padding: 20px 40px;
    border-radius: 10px;
    box-shadow: 0 0 15px #ffd700;
  }

  nav {
    background: #002200;
    display: flex;
    justify-content: center;
    padding: 15px;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    margin: 0 20px;
    font-size: 18px;
    transition: color 0.3s;
  }
  nav a:hover {
    color: #ffd700;
  }

  section {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 15px;
  }

  #contato {
    background: #004400;
    padding: 30px;
    border-radius: 8px;
    color: #d4ff7f;
    box-shadow: 0 0 15px #a6d608;
  }
  #contato h3 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;
  }
  #contato p {
    font-size: 20px;
    text-align: center;
    margin: 10px 0;
  }
  #contato a {
    display: inline-block;
    margin-top: 15px;
    background: #a6d608;
    color: #003300;
    font-weight: bold;
    padding: 12px 25px;
    border-radius: 5px;
    text-decoration: none;
    font-size: 20px;
    transition: background 0.3s;
  }
  #contato a:hover {
    background: #ffd700;
  }

  footer {
    background: #002200;
    text-align: center;
    padding: 20px 10px;
    font-size: 14px;
    color: #8fbc8f;
  }

  @media (max-width: 600px) {
    .cover h2 {
      font-size: 24px;
      padding: 15px 20px;
    }
    nav {
      flex-direction: column;
    }
    nav a {
      margin: 10px 0;
    }
  }
</style>
</head>
<body>

<header>
  <img src="Designer%20(1).png" alt="Logotipo VaiLog" />
  <h1>VaiLog</h1>
  <p class="slogan">Chamou, carregou, a VaiLog entregou!</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#contato">Contato</a>
</nav>

<section class="cover" id="home">
  <h2>Logística que conecta o Brasil com agilidade e confiança!</h2>
</section>

<section id="contato">
  <h3>Contato</h3>
  <p>Telefone e WhatsApp:</p>
  <p><strong>(11) 93145-4349</strong></p>
  <p>Clique no botão abaixo para iniciar uma conversa no WhatsApp:</p>
  <p><a href="https://wa.me/5511931454349" target="_blank" rel="noopener">Enviar Mensagem</a></p>
</section>

<footer>
  &copy; 2026 VaiLog. Todos os direitos reservados.
</footer>

</body>
</html>
